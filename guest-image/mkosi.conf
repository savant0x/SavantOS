# mkosi config — SavantOS guest builder (Phase 1)
#
# Distribution and content for a rootless DIRECTORY build. Disk assembly is
# NOT mkosi's job here: the launcher contract (F2 in FID-2026-0912-001) needs
# a plain unpartitioned ext4 image (root=/dev/vda), and every mkosi disk
# format emits a partition table. assemble.sh turns mkosi's output tree into
# that image with mke2fs -d, matching the mechanism that produced the
# currently shipped factory shape.

[Distribution]
Distribution=arch
Architecture=x86-64
# Snapshot pin — must equal snapshot.lock.json (checked by check-snapshot-lock.sh).
Mirror=https://archive.archlinux.org/repos/2026/08/11/

[Output]
Format=directory

[Content]
Packages=
    base
    linux-zen
    linux-firmware
    systemd
    networkmanager
    openssh
    sudo
    bash
    coreutils
    filesystem
    mkinitcpio
    e2fsprogs
    pciutils
    kmod
    pacman
    ca-certificates
    nano
    less
    which
    gawk
    grep
    sed
    tar
    gzip
    zstd
    xz
    file
    findutils
    diffutils
    procps-ng
    iproute2
    iputils
    inetutils

WithDocs=no

# Factory overlays copied into the image tree before packages install (the
# patch train's factory-overlay equivalent). The postinst sandbox does not
# bind the source tree, so skeletons must ride in via mkosi itself.
SkeletonTrees=skeletons:/

PostInstallationScripts=finalize.sh

[Build]
# Reproducibility: every file timestamp inside the tree comes from this epoch,
# overridden per-file at assembly (SOURCE_DATE_EPOCH in build.sh must agree).
Environment=SOURCE_DATE_EPOCH=1787652758
Environment=MKOSI_FLAGS=--checksum
CacheDirectory=mkosi-cache
