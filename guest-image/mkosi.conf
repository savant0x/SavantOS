# mkosi config — SavantOS guest builder (Phase 1)
#
# Distribution and content for a rootless DIRECTORY build. Disk assembly is
# NOT mkosi's job here: the launcher contract (F2 in FID-2026-0912-001) needs
# a plain unpartitioned ext4 image (root=/dev/vda), and every mkosi disk
# format emits a partition table. assemble.sh turns mkosi's output tree into
# that image with mke2fs -d, matching the mechanism that produced the
# currently shipped factory shape.

[Distribution]
Distribution=arch
Architecture=x86-64
# Snapshot pin — must equal snapshot.lock.json (checked by check-snapshot-lock.sh).
Mirror=https://archive.archlinux.org/repos/2026/08/11/

[Output]
Format=directory

[Content]
