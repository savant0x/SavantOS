    # --- De-2000 theming (FID-2026-0913-001): Kvantum widget engine (Qt6
    # style plugin at /usr/lib/qt6/plugins/styles/libkvantum.so, confirmed in
    # the Arch extra file list, 2026-09-13) + Papirus icons (GPL-3.0, extra;
    # pulls gtk-update-icon-cache — finalize.sh strips the runtime caches it
    # generates so the dual-build digest gate stays deterministic).
    kvantum
    papirus-icon-theme
    # --- Desktop experience (FID-2026-0915-006): both verified present on
    # the pinned 2026-08-11 snapshot (extra.db listing, 2026-09-15) before
    # listing: chromium 151.0.7922.108-1, featherpad 1.6.3-1 (deps qt6-svg +
    # hunspell already satisfied). colloid-icon-theme was NOT found on the
    # pin, so Papirus stays (D3 explicit fallback).
    chromium
    featherpad
    # --- Key provisioning (FID-2026-0917-002): the guest half of the
    # clipboard bridge (host listeners 4448/4449 already exist in the
    # launcher). wl-clipboard gives wl-paste/wl-copy; socat is the bridge's
    # TCP transport. Both verified present on the pinned 2026-08-11
    # snapshot (extra.db) before listing — same discipline as chromium
    # above. Both also verified INSTALLED in the live 2026-09-17 guest by
    # the factory "runtime pacman -S" criterion before this edit.
    socat
    wl-clipboard

WithDocs=no

# Factory overlays copied into the image tree before packages install (the
# patch train's factory-overlay equivalent). The postinst sandbox does not
# bind the source tree, so skeletons must ride in via mkosi itself.
SkeletonTrees=skeletons:/
# The pacman fetcher tuning lives in sandbox/pacman.conf and ships via
# SandboxTrees (configured in [Build] below): mkosi invokes pacman from
# OUTSIDE the image, so package-manager config must arrive through the
# sandbox tree, not SkeletonTrees (mkosi 27 man page, "SandboxTrees").

PostInstallationScripts=finalize.sh

[Build]
# Reproducibility: every file timestamp inside the tree comes from this epoch,
# overridden per-file at assembly (SOURCE_DATE_EPOCH in build.sh must agree).
Environment=SOURCE_DATE_EPOCH=1787652758
Environment=MKOSI_FLAGS=--checksum
# Pacman fetch tuning for the flaky pinned-archive mirror: see sandbox/
# pacman.conf. Parallel downloads fan the ~730-package desktop install
# across connections and the idle timeout is disabled, so one throttled
# stream cannot abort the transaction (builds 2-5 failed this way on
# 2026-09-12: "Operation too slow" on a different large file each time).
# Signature verification is untouched. Lives in [Build] per mkosi 27.
SandboxTrees=sandbox:/etc
CacheDirectory=mkosi-cache
