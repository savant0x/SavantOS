# pacman configuration for mkosi's package-manager sandbox (mkosi 27).
#
# Shipped via SandboxTrees=sandbox:/etc (see mkosi.conf, [Build]): mkosi
# invokes pacman from OUTSIDE the image, so package-manager config must
# arrive through the sandbox tree, not SkeletonTrees (mkosi 27 man page,
# "SandboxTrees"). When /etc/pacman.conf exists in the sandbox tree, mkosi
# uses it VERBATIM and skips generating its own — including the repository
# definitions (verified in mkosi 27's installer/pacman.py: setup() returns
# early after stripping DownloadUser). So this file must carry everything:
# the fetch tuning AND the pinned snapshot repositories.
#
# The repositories below are the exact URLs mkosi's Arch plugin would have
# generated from Mirror= + Snapshot=: archive.archlinux.org, snapshot
# 20260811 (the pin in snapshot.lock.json, checked by check-snapshot-lock.sh
# against mkosi.conf's Mirror= — keep the two in sync).
#
# Why this file exists: the ~730-package desktop install over the pinned
# archive dies on throttling with single-stream fetches — "Operation too
# slow. Less than 1 bytes/sec transferred the last 10 seconds" on a
# different large file each build (builds 2-5, 2026-09-12). This pacman
# (7.1, snapshot-era) has no DisableDownloadTimeout option (warning
# observed, builds 7-8), but ParallelDownloads=5 is supported and is the
# load-bearing resilience: five concurrent streams mean one stalled file
# no longer stalls the transaction, and pacman retries failed downloads
# within the parallel window. Signature verification is untouched.

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# NoExtract mirrors mkosi's defaults: docs never enter the factory image.
NoExtract = usr/share/doc/*
NoExtract = usr/share/man/*
NoExtract = usr/share/groff/*
NoExtract = usr/share/gtk-doc/*
NoExtract = usr/share/info/*

# mkosi's local-repository channel: mkosi touches this file itself and its
# createrepo() writes the [mkosi] section into it during the build.
Include = /etc/mkosi-local.conf

[core]
Server = https://archive.archlinux.org/repos/2026/08/11/core/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/08/11/extra/os/$arch
