# Drop-in giving systemd-growfs-root.service an [Install] section.
#
# The unit ships without one (verified in systemd 261.2), so `systemctl
# preset` cannot enable it — and mkosi's preset-all pass strips hand-made
# wants symlinks. With WantedBy declared here, the factory preset policy
# (90-savantos-factory.preset) enables it properly: the root filesystem
# grows from its 6 GiB factory shape into the launcher-truncated 24 GiB
# disk at every boot (FID-2026-0912-001 F3).

[Install]
WantedBy=local-fs-pre.target
