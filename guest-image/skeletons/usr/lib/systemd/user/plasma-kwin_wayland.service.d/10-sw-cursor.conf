[Service]
# FID-2026-0916-001 incident 2026-09-17: under QEMU SDL-GL on Windows
# (virtio-vga-gl + Venus), KWin's DRM hardware-cursor-plane content is
# dropped by the host window on the click path, leaving an invisible
# pointer while input stays live. Forcing the software cursor draws it
# in-frame, which survives the host path. Keep for all virtual GPUs.
Environment=KWIN_FORCE_SW_CURSOR=1
