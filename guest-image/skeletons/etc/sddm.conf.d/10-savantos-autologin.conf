# SDDM factory configuration — SavantOS.
#
# Autologin straight into the Plasma Wayland session as the factory
# account. The greeter itself also runs Wayland: the launcher's QEMU
# exposes a virtio-gpu (venus/virgl) display, and the X11 greeter path
# would add a modesetting layer the image does not ship drivers for.
#
# Relogin=true returns to the session after logout instead of the
# greeter — single-user appliance behavior (FID-2026-0912-002 R2).

[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_DISABLE_WINDOWDECORATION=1

[Theme]
Current=breeze

[Users]
DefaultAvatar=.face.icon
HiddenShells=/sbin/nologin,/usr/bin/nologin,/bin/false
MinimumUid=1000

[Autologin]
User=savant
Session=plasma.desktop
Relogin=true
